# Development-only overrides, automatically merged into docker-compose.yml by
# Compose when running `docker compose up` locally. It is NOT used in CI or
# production; to run without it, pass `-f docker-compose.yml` explicitly
services:
  # Hot reload for the backend via `docker compose up --watch`
  backend:
    develop:
      watch:
        - action: sync
          path: backend
          target: /app
        - action: rebuild
          path: backend/requirements.txt
        - action: rebuild
          path: backend/Dockerfile
  frontend:
    develop:
      watch:
        - action: sync
          path: frontend
          target: /app
        - action: rebuild
          path: frontend/package.json
        - action: rebuild
          path: frontend/package-lock.json
        - action: rebuild
          path: frontend/Dockerfile
