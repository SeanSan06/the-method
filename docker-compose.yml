# Base Compose file shared by every environment (local, CI, production)
#
# Compose automatically merges this with docker-compose.override.yml when
# running locally; see that file for hot-reload / watch configuration
services:
  # FastAPI backend: serves the REST API + interactive docs at /docs
  backend:
    build: backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://admin:zlg1DY1b1T3S@db:5432/the_method
    depends_on:
      db:
        condition: service_healthy
  # Vite dev server: serves the React frontend with HMR on port 5173
  frontend:
    build: frontend
    ports:
      - "5173:5173"
  # Single-instance PostgreSQL database.
  db:
    image: postgres:18-alpine
    volumes:
      - postgres-data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=the_method
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=zlg1DY1b1T3S
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d the_method"]
      interval: 10s
      timeout: 5s
      retries: 5

# Declares the named volume used by the db service above
volumes:
  postgres-data:
